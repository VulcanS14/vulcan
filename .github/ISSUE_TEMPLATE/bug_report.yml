name: Crash/Bug report
description: Create a report to help us improve
title: "[BUG] YOUR TITLE HERE"
labels: [Bug]
body:
    - type: textarea
      id: bug-description
      attributes:
          label: "Describe the crash or bug"
          description: A clear and concise description of what the bug is, or what you may think is causing crashing.
          placeholder: What's happening? What did you expect to happen?
      validations:
          required: true
    - type: textarea
      id: scratch-project
      attributes:
          label: "Scratch Project"
          description: If comfortable, you can provide a link to the project file to help easily pinpoint the issue.
          placeholder: Link to .vup/.sb file, or describe how to get it.
      validations:
          required: false
    - type: textarea
      id: screenshots
      attributes:
          label: "Screenshots"
          description: If applicable, add screenshots of the crash screen, and any code you may think is causing the issue. Drag and drop images here, or provide links.
      validations:
          required: false
    - type: dropdown
      id: devices
      attributes:
          label: "Device(s)"
          description: What device(s) are you experiencing this on?
          multiple: true
          options:
              - Windows 95
              - Windows NT 4.0
              - Windows 98
              - Windows ME
              - Windows 2000
              - Windows XP
              - Windows Vista
              - Windows 7
              - Windows 8
              - Windows 8.1
              - Windows 10
              - Windows 11
              - ReactOS
              - ReactOS Nightly
              - Mac OS X 10.4 Tiger
              - Mac OS X 10.5 Leopard
              - Mac OS X 10.6 Snow Leopard
              - Mac OS X 10.7 Lion
              - OS X 10.8 Mountain Lion
              - OS X 10.9 Mavericks
              - OS X 10.10 Yosemite
              - OS X 10.11 El Capitan
              - macOS 10.12 Sierra
              - macOS 10.13 High Sierra
              - macOS 10.14 Mojave
              - Ubuntu
              - Debian
              - Other Linux distro (specify in additional context)
              - SqueakJS
              - Other (specify in additional context)
    - type: textarea
      id: additional-context
      attributes:
          label: "Additional context"
          description: Add any other context about the problem here (e.g., reproduction steps, frequency, any workarounds you've tried).
      validations:
          required: false
    - type: checkboxes
      id: pre-checks
      attributes:
          label: "Pre-submission Checks"
          description: Please confirm the following before submitting.
          options:
              - label: I have searched existing issues and confirmed this bug has not been reported before.
                required: true
              - label: I have checked the known issues/roadmap and confirmed this is not a known limitation or planned fix.
                required: true
              - label: I have checked that I have the latest version of Vulcan.
                required: true